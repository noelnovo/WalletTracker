[versions]
androidx-core = "1.17.0"
androidx-appcompat = "1.7.1"
material = "1.13.0"
constraintlayout = "2.2.1"
lifecycle = "2.9.4"
navigation = "2.9.5"
legacy-support = "1.0.0"
fragment = "1.8.9"
junit = "4.13.2"
androidx-junit = "1.3.0"
espresso-core = "3.7.0"
retrofit = "3.0.0"
gson = "3.0.0"
activity = "1.11.0"
ui-android = "1.9.4"
swiperefreshlayout = "1.2.0-beta01"
biometricDependency = "1.4.0-alpha04"
androidApplicationGradlePluguin = "9.0.1"
kotlinAndroidGradlePluguin = "2.2.21"
kspGradlePluguin = "2.3.2"
hiltGradlePluguin = "2.57.2"

# Patched transitive/tooling families. Keep the existing BOM scope: do not hide
# test/UTP/compiler dependencies merely because they are not shipped in the APK.
security-netty = "4.1.140.Final"
security-bouncycastle = "1.86"
security-opentelemetry = "1.68.0"
security-guava = "33.8.0"
security-protobuf = "3.25.9"
security-commons-lang3 = "3.21.0"
security-httpclient = "4.5.14"

[plugins]
android-application = { id = "com.android.application", version.ref = "androidApplicationGradlePluguin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlinAndroidGradlePluguin" }
ksp = { id ="com.google.devtools.ksp", version.ref = "kspGradlePluguin" }
hilt = { id ="com.google.dagger.hilt.android", version.ref = "hiltGradlePluguin"}

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
androidx-legacy-support-v4 = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "legacy-support" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-junit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometricDependency"}
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "gson" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-ui-android = { group = "androidx.compose.ui", name = "ui-android", version.ref = "ui-android" }
swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hiltGradlePluguin" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hiltGradlePluguin" }

