stages: [test, build, publish]

default:
  interruptible: true

contract:
  stage: test
  image: python:3.13-alpine
  script:
    - python3 delivery/verify_contract.py
    - python3 -m unittest discover -s delivery -p 'test_*.py'

.android-build:
  stage: build
  image: eclipse-temurin:21-jdk
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.int.downops.win
  variables:
    ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-ci"
  cache:
    key: android-dev-toolchain
    paths: [.android-sdk/, .gradle-ci/caches/, .gradle-ci/wrapper/]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends unzip wget python3
    - mkdir -p "$ANDROID_HOME/cmdline-tools"
    - if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O sdk.zip; unzip -q sdk.zip -d "$ANDROID_HOME/cmdline-tools"; mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"; fi
    - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || test -f "$ANDROID_HOME/licenses/android-sdk-license"
    - '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"'

dev-apk:
  extends: .android-build
  resource_group: wallettracker-android-dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $ANDROID_CI_CAPACITY_READY == "true"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
  script:
    - python3 delivery/build_dev.py
  artifacts:
    name: wallettracker-dev-$CI_COMMIT_SHORT_SHA
    paths: [app/build/outputs/apk/debug/*.apk, app/build/reports/tests/]
    expire_in: 14 days

prod-apk:
  extends: .android-build
  resource_group: wallettracker-android-prod
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  environment: production
  script:
    - python3 delivery/build_prod.py
  artifacts:
    name: wallettracker-production-$CI_COMMIT_TAG
    paths: [delivery/artifacts/*.apk, delivery/artifacts/*.sha256, delivery/artifacts/release-receipt.json]
    expire_in: 30 days

publish-prod:
  stage: publish
  image: python:3.13-alpine
  interruptible: false
  resource_group: wallettracker-android-release
  needs: [prod-apk]
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.int.downops.win
  rules:
    # Owner selected server-side operator REST publication, not CI publication.
    # Keep this job disabled; the separate CI credential is intentionally absent.
    - when: never
  environment: production
  before_script:
    - apk add --no-cache git
  script:
    - python3 delivery/publish_prod.py
