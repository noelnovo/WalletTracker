# This entire entrypoint is pinned in the project's external ci_config_path.
# MRs cannot substitute a fake passing pipeline or execute source with scan keys.
include:
  - project: downops/github-workflows
    ref: 95590ca0c2c02109431a740c2ae0868d89e1ac97
    file: /gitlab/dependency-track-scan.yml

stages: [checks, test, build, security, publish]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/)'

.delivery-control:
  variables:
    GIT_DEPTH: "0"
    DELIVERY_CONTROL_SHA: b218d0e512f179b17228fef05e2e855dc6336429
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 git ca-certificates > /dev/null
    - |
      set -eu
      export DELIVERY_CONTROL_DIR="$(mktemp -d)"
      git fetch -q --no-tags origin "$DELIVERY_CONTROL_SHA"
      test "$(git rev-parse "$DELIVERY_CONTROL_SHA^{commit}")" = "$DELIVERY_CONTROL_SHA"
      git archive "$DELIVERY_CONTROL_SHA" ci/ | tar -xf - -C "$DELIVERY_CONTROL_DIR"

checks:
  stage: checks
  image: python:3.13-alpine
  script:
    - pip install --quiet coverage==7.16.2
    - python3 -m coverage run --source=. -m scripts.ci.verify_contract
    - python3 -m coverage run --append --source=. -m unittest discover -s tests/automation -p 'test_*.py'
    - python3 -m coverage run --append --source=. -m unittest discover -s ci -p 'test_*.py'
    - python3 -m coverage xml --include='ci/*.py,scripts/**/*.py' --omit='ci/test_*.py' -o coverage/python.xml
  artifacts:
    paths: [coverage/python.xml]
    expire_in: 7 days

.android-build:
  extends: .delivery-control
  image: eclipse-temurin:21-jdk
  resource_group: wallettracker-android-gradle
  variables:
    ANDROID_HOME: $CI_PROJECT_DIR/.android-sdk
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  cache:
    key: android-sdk-36-bounded
    paths: [.android-sdk/, .gradle/caches/, .gradle/wrapper/]

unit-tests:
  extends: .android-build
  stage: test
  needs: [checks]
  script:
    - python3 "$DELIVERY_CONTROL_DIR/ci/setup_android.py"
    - sh gradlew --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:MaxDirectMemorySize=128m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest jacocoTestReport
  artifacts:
    paths:
      - app/build/reports/jacoco/
      - app/build/intermediates/javac/
      - app/build/tmp/kotlin-classes/
      - app/build/intermediates/built_in_kotlinc/
    expire_in: 7 days

release-build:
  extends: .android-build
  stage: build
  needs:
    - job: unit-tests
      artifacts: false
  script:
    - python3 "$DELIVERY_CONTROL_DIR/ci/setup_android.py"
    - sh gradlew --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:MaxDirectMemorySize=128m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process assembleDebug assembleRelease cyclonedxBom
    - python3 -c 'import hashlib,json,os,pathlib; p=pathlib.Path("app/build/outputs/apk/release/app-release-unsigned.apk"); pathlib.Path("release-input.json").write_text(json.dumps({"sha":os.environ["CI_COMMIT_SHA"],"pipeline":os.environ["CI_PIPELINE_ID"],"unsigned_sha256":hashlib.sha256(p.read_bytes()).hexdigest()}))'
  artifacts:
    paths:
      - build/reports/cyclonedx/bom.json
      - app/build/outputs/apk/release/app-release-unsigned.apk
      - app/build/generated/source/buildConfig/release/
      - release-input.json
    expire_in: 7 days

.android-security-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"'

security-build:
  stage: build
  needs:
    - job: checks
      artifacts: true
    - job: unit-tests
      artifacts: true
    - job: release-build
      artifacts: true
  rules: !reference [.android-security-rules, rules]

security:
  rules: !reference [.android-security-rules, rules]

release:
  extends: .delivery-control
  stage: publish
  image: eclipse-temurin:21-jdk
  cache: []
  interruptible: false
  resource_group: wallettracker-android-production
  variables:
    ANDROID_HOME: /tmp/verified-signing-sdk
    SIGNING_SDK_ONLY: "true"
    VAULT_RESOLVE_ADDRESS: "10.2.0.10"
  needs:
    - job: security
      artifacts: false
    - job: security-build
      artifacts: true
    - job: release-build
      artifacts: true
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.int.downops.win
  environment:
    name: production
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
  script:
    - python3 "$DELIVERY_CONTROL_DIR/ci/setup_android.py"
    - cd "$DELIVERY_CONTROL_DIR" && python3 -m ci.release_publish
  artifacts:
    paths: [artifacts/]
    expire_in: 90 days
