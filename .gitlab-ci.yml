# GitLab-native delivery for the android client. GitLab is the CI owner:
# validation, security gates, and the protected-tag signed release.
# The GitHub repository is a passive backup mirror.
stages: [checks, build, security, publish]

checks:
  stage: checks
  image: python:3.13-alpine
  script:
    - python3 -m scripts.ci.verify_contract
    - python3 -m unittest discover -s tests/automation -p 'test_*.py'
    - python3 -m unittest discover -s ci -p 'test_*.py'

jvm-tests-and-builds:
  stage: build
  image: eclipse-temurin:21-jdk
  variables:
    ANDROID_HOME: /opt/android-sdk
    GRADLE_USER_HOME: .gradle
  cache:
    key: android-sdk-36
    paths: [/opt/android-sdk]
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends wget unzip > /dev/null
    - if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then mkdir -p "$ANDROID_HOME/cmdline-tools" && wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip && unzip -q commandlinetools-linux-11076708_latest.zip -d "$ANDROID_HOME/cmdline-tools" && mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"; fi
    - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
    - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null
    - sh gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest jacocoTestReport assembleDebug assembleRelease cyclonedxBom
    - cp build/reports/cyclonedx/bom.json bom.json
  artifacts:
    paths:
      - bom.json
      - app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
      - app/build/outputs/apk/release/app-release-unsigned.apk
      - app/build/generated/source/buildConfig/release/
    expire_in: 7 days

security-gates:
  stage: security
  image: python:3.13
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  resource_group: wallettracker-android-security
  needs:
    - job: jvm-tests-and-builds
      artifacts: true
    - job: checks
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.int.downops.win
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/)'
  script:
    - apk add --no-cache docker-cli > /dev/null
    - pip install --quiet docker
    - python3 -m ci.security_scan

release:
  stage: publish
  image: python:3.13
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  interruptible: false
  resource_group: wallettracker-android-prod
  needs:
    - job: security-gates
    - job: jvm-tests-and-builds
      artifacts: true
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.int.downops.win
  environment:
    name: production
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
  script:
    - apk add --no-cache docker-cli git > /dev/null
    - pip install --quiet docker
    - python3 -m ci.release_publish
  artifacts:
    paths: [artifacts/]
    expire_in: 90 days
