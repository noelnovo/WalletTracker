name: WalletTracker trusted pre-merge security
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  security:
    name: Security
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
      id-token: write
    # Literal shared control, not scripts/configuration supplied by the PR.
    # Required security/sonarqube-dtrack-{dev,main} statuses stay unchanged.
    uses: noelnovo/.github/.github/workflows/dependency-track-scan.yml@cc4ce6779f6f4ee751f1f30b2a319b08adb20830
