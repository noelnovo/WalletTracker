name: Android integration checks
on:
  push:
    branches: [dev, 'fix/**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source API contract
        run: python3 delivery/verify_contract.py
      - name: Compile debug sources and run JVM unit tests
        run: bash ./gradlew testDebugUnitTest --no-daemon
