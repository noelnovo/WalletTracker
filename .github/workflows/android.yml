name: WalletTracker Android

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallettracker-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      signing_ready: ${{ steps.gates.outputs.signing_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 delivery/verify_contract.py
      - run: python3 -m unittest discover -s delivery -p 'test_*.py'
      - id: gates
        run: python3 -c 'import json,os; value=json.load(open("delivery/github-actions-status.json"))["vault_signing_ready"]; assert type(value) is bool; open(os.environ["GITHUB_OUTPUT"],"a").write("signing_ready=" + str(value).lower() + "\n")'

  unsigned-build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: sh gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-build-test-reports
          path: app/build/reports/tests/
          retention-days: 7

  release-context:
    needs: [checks, unsigned-build]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && github.ref_protected && needs.checks.outputs.signing_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact release tag is on GitHub main before accessing secrets
        run: PYTHONPATH=delivery python3 -c 'import os; from build_prod import validate_identity; validate_identity(os.environ)'

  prod-apk:
    needs: release-context
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - id: vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.downops.win
          method: jwt
          path: github-actions
          role: wallettracker-mobile-ci-prod
          jwtGithubAudience: https://vault.downops.win
          exportToken: false
          exportEnv: false
          secrets: downops/data/apps/wallettracker/prod/mobile * | PROD_
      - run: python3 delivery/build_prod.py
        env:
          SIGNING_INPUT_JSON: ${{ toJSON(steps.vault.outputs) }}
      - uses: actions/upload-artifact@v4
        with:
          name: wallettracker-production-${{ github.sha }}
          path: delivery/artifacts/
          if-no-files-found: error
          retention-days: 30

  publish-prod:
    needs: prod-apk
    runs-on: ubuntu-latest
    # Production is approved once before signing. This job only publishes the
    # verified, immutable artifact from that successful same-run signing job.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wallettracker-production-${{ github.sha }}
          path: delivery/artifacts/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 delivery/publish_prod.py
        env:
          GH_TOKEN: ${{ github.token }}
