name: WalletTracker production release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: wallettracker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-context:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      validation_run_id: ${{ steps.evidence.outputs.validation_run_id }}
      validation_run_attempt: ${{ steps.evidence.outputs.validation_run_attempt }}
      validation_artifact_id: ${{ steps.evidence.outputs.validation_artifact_id }}
      validation_artifact_name: ${{ steps.evidence.outputs.validation_artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact release tag is on GitHub main before accessing secrets
        run: python3 -c 'import os; from scripts.build.build_prod import validate_identity; validate_identity(os.environ)'
      - name: Require successful exact-commit MAIN validation and retained artifact
        id: evidence
        run: python3 -m scripts.ci.release_validation
        env:
          GITHUB_TOKEN: ${{ github.token }}

  prod-apk:
    needs: release-context
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Download only the validated MAIN artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release-context.outputs.validation_artifact_id }}
          merge-multiple: true
          run-id: ${{ needs.release-context.outputs.validation_run_id }}
          github-token: ${{ github.token }}
          path: validated-input/
      - name: Verify unsigned APK and configuration before reading signing secrets
        run: python3 -m scripts.ci.package_validated_apk --verify
        env:
          EXPECTED_VALIDATION_RUN_ID: ${{ needs.release-context.outputs.validation_run_id }}
          EXPECTED_VALIDATION_RUN_ATTEMPT: ${{ needs.release-context.outputs.validation_run_attempt }}
          EXPECTED_VALIDATION_ARTIFACT_ID: ${{ needs.release-context.outputs.validation_artifact_id }}
      - id: vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.downops.win
          method: jwt
          path: github-actions
          role: wallettracker-mobile-ci-prod
          jwtGithubAudience: https://vault.downops.win
          exportToken: false
          exportEnv: false
          secrets: downops/data/apps/wallettracker/prod/mobile * | PROD_
      - run: python3 -m scripts.build.build_prod
        env:
          SIGNING_INPUT_JSON: ${{ toJSON(steps.vault.outputs) }}
          EXPECTED_VALIDATION_RUN_ID: ${{ needs.release-context.outputs.validation_run_id }}
          EXPECTED_VALIDATION_RUN_ATTEMPT: ${{ needs.release-context.outputs.validation_run_attempt }}
          EXPECTED_VALIDATION_ARTIFACT_ID: ${{ needs.release-context.outputs.validation_artifact_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: wallettracker-production-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  publish-prod:
    needs: prod-apk
    runs-on: ubuntu-latest
    # Production is approved once before signing. This job only publishes the
    # verified, immutable artifact from that successful same-run signing job.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wallettracker-production-${{ github.sha }}
          path: artifacts/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m scripts.release.publish_prod
        env:
          GH_TOKEN: ${{ github.token }}
