name: WalletTracker validation

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: wallettracker-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m scripts.ci.verify_contract
      - run: python3 -m unittest discover -s tests/automation -p 'test_*.py'

  unsigned-build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build APKs
        run: sh gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-build-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/reports/tests/
          retention-days: 7
      - name: Package exact-source validated unsigned APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 -m scripts.ci.package_validated_apk
        env:
          VALIDATION_CHECKS_RESULT: ${{ needs.checks.result }}
      - name: Retain MAIN validation input for release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: validated-unsigned-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/validated-input/
          if-no-files-found: error
          retention-days: 90
