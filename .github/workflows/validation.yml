name: WalletTracker validation

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: wallettracker-validation-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m scripts.ci.verify_contract
      - run: python3 -m unittest discover -s tests/automation -p 'test_*.py'
      - run: python3 -m unittest discover -s ci -p 'test_*.py'

  unsigned-build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build APKs
        run: sh gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest jacocoTestReport assembleDebug assembleRelease cyclonedxBom
      - name: Retain resolved SBOM and bytecode for exact-source security analysis
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: security-input-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/reports/cyclonedx/bom.json
            app/build/reports/jacoco/**/jacocoTestReport.xml
            app/build/intermediates/javac/**/classes/**
            app/build/tmp/kotlin-classes/**
            app/build/intermediates/built_in_kotlinc/**/classes/**
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-build-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/reports/tests/
          retention-days: 7
      - name: Package exact-source validated unsigned APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 -m scripts.ci.package_validated_apk
        env:
          VALIDATION_CHECKS_RESULT: ${{ needs.checks.result }}
      - name: Retain MAIN validation input for release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: validated-unsigned-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/validated-input/
          if-no-files-found: error
          retention-days: 90

  security-analysis:
    if: github.event_name == 'push'
    needs: [checks, unsigned-build]
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
      id-token: write
    uses: noelnovo/.github/.github/workflows/dependency-track-scan.yml@cc4ce6779f6f4ee751f1f30b2a319b08adb20830

  # Preserve the exact mandatory release-evidence job name. This is only an
  # aggregate result: scanner implementation/credentials live in the generic.
  security:
    if: always() && github.event_name == 'push'
    needs: security-analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the successful shared security analysis
        env:
          SECURITY_RESULT: ${{ needs.security-analysis.result }}
        run: test "$SECURITY_RESULT" = success
